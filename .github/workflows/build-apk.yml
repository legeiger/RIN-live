name: Build Android APK

on:
  push:
    branches:
      - main
      - flet
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Patch flet-charts tooltip assertion bug
        run: |
          python -c "
          import pathlib, site
          for p in site.getsitepackages():
              f = pathlib.Path(p) / 'flutter/flet_charts/lib/src/utils/line_chart.dart'
              if f.exists():
                  t = f.read_text('utf-8')
                  t = t.replace('.nonNulls\n          .toList()', '.toList()').replace('.nonNulls.toList()', '.toList()')
                  f.write_text(t, 'utf-8')
                  print('Successfully patched', f)
          "

      - name: Build APK
        run: |
          flet build apk --org de.unistuttgart.isv --project rin --product "RIN-Live" --permissions location --yes

      - name: Prepare APK File
        run: |
          mkdir -p dist
          cp build/apk/*.apk dist/RIN-Live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RIN-Live-release-apk
          path: dist/RIN-Live.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true))
        uses: softprops/action-gh-release@v3
        with:
          files: dist/RIN-Live.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'RIN-Live (Release Build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
