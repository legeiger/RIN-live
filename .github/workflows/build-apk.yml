name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Read Version Metadata
        id: meta
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          HEAD_TAG=$(git tag --points-at HEAD | head -n 1)
          if [ -n "$HEAD_TAG" ]; then
            TAG_NAME="$HEAD_TAG"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}, tag_name=${TAG_NAME}"

      - name: Install Dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Patch flet-charts and Android background location service
        run: |
          python .github/scripts/patch_flet_android.py

      - name: Configure Gradle and Build Environment
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          EOF
          mkdir -p ~/.flet/cache

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1"
        run: |
          flet build apk --org de.unistuttgart.isv --project rin --product "RIN-Live" --permissions location --build-version "${{ steps.meta.outputs.version }}" --arch arm64-v8a armeabi-v7a --yes

      - name: Prepare APK File
        run: |
          mkdir -p dist
          cp build/apk/*.apk dist/RIN-Live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RIN-Live-release-apk
          path: dist/RIN-Live.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true))
        uses: softprops/action-gh-release@v3
        with:
          files: dist/RIN-Live.apk
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: RIN-Live v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag_name }})
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
