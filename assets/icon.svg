<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitionen & Styles -->
  <defs>
    <style>
      .bg { fill: #0a0c10; }
      .brand-text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 152px;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      .axis-line { stroke: #2a3444; stroke-width: 3.5; stroke-dasharray: 6 8; stroke-linecap: round; }
      .graph-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .curve-top { stroke: #10b981; stroke-width: 14; }
      .curve-mid { stroke: #f59e0b; stroke-width: 14; }
      .curve-bot { stroke: #ef4444; stroke-width: 14; }
      .origin-node { fill: #475569; }
    </style>
  </defs>

  <!-- Hintergrund (Full Canvas für maximale Größenausnutzung im Launcher) -->
  <g id="background">
    <rect class="bg" width="500" height="500" />
  </g>

  <!-- Branding / Logo-Schriftzug (Maximale Größe) -->
  <g id="logo-branding">
    <text class="brand-text" x="32" y="152">RIN</text>
  </g>

  <!-- Koordinatensystem / Basislinien -->
  <g id="axes">
    <line class="axis-line" x1="32" y1="468" x2="468" y2="468" />
    <line class="axis-line" x1="32" y1="468" x2="32" y2="185" />
  </g>

  <!-- Degressiv ansteigende Graphen (f'(x) > 0, f''(x) < 0) -->
  <g id="degressive-graphs">
    <!-- Oberer Graph: Grün (Ziel: y = 195) -->
    <path id="graph-green" class="graph-line curve-top" d="M 32 468 C 115 230, 260 195, 468 195" />
    
    <!-- Mittlerer Graph: Bernstein/Gelb (Ziel: y = 275) -->
    <path id="graph-amber" class="graph-line curve-mid" d="M 32 468 C 125 300, 270 275, 468 275" />
    
    <!-- Unterer Graph: Rot (Ziel: y = 355) -->
    <path id="graph-red" class="graph-line curve-bot" d="M 32 468 C 135 370, 280 355, 468 355" />
  </g>

  <!-- Graph-Endpunkte & Ursprungspunkt -->
  <g id="data-nodes">
    <circle class="origin-node" cx="32" cy="468" r="8" />
    <circle cx="468" cy="195" r="10" fill="#10b981" />
    <circle cx="468" cy="275" r="10" fill="#f59e0b" />
    <circle cx="468" cy="355" r="10" fill="#ef4444" />
  </g>
</svg>
