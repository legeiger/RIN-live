[project]
name = "rin-live"
version = "0.9.2"
description = "Real-time RIN 2008 journey tracking and SAQ evaluation."
requires-python = ">=3.12"
authors = [
    { name = "Leander Geiger", email = "leander@lgeiger.de" }
]
dependencies = [
    "flet>=1.0.1",
    "flet-geolocator>=1.0.1",
    "flet-charts>=1.0.1",
    "geopy>=2.4.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["views"]
py-modules = ["main", "models"]

[project.optional-dependencies]
dev = [
    "flet-cli>=1.0.1",
    "flet-desktop>=1.0.1",
    "flet-web>=1.0.1"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.1",
    "flet-desktop>=1.0.1",
    "flet-web>=1.0.1"
]

[tool.flet.metadata]
title = "RIN-Live"

[tool.flet]
org = "de.unistuttgart.isv"
project = "rin"
product = "RIN-Live"
company = "ISV - Universität Stuttgart"
copyright = "Copyright (C) 2026 ISV Universität Stuttgart"
permissions = ["location"]

[tool.flet.android.permission]
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
"android.permission.ACCESS_BACKGROUND_LOCATION" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_LOCATION" = true
"android.permission.WAKE_LOCK" = true
"android.permission.ACCESS_WIFI_STATE" = true
"android.permission.CHANGE_WIFI_STATE" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" = true

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"

